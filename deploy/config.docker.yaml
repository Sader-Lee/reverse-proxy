# 容器内使用的配置：后端地址用 compose 的服务名解析
# 由 docker-compose.yml 挂载到代理容器的 /etc/proxy/config.yaml
listen: ":8080"

# 加权轮询：backend-a 权重是 backend-b 的 3 倍
strategy: "weighted-round-robin"

backends:
  - url: "http://backend-a:9001"
    weight: 3
  - url: "http://backend-b:9001"
    weight: 1

health_check:
  enabled: true
  path: "/healthz"
  interval: "3s"
  timeout: "1s"
  failure_threshold: 2
  success_threshold: 1

retry:
  max_attempts: 3
  per_try_timeout: "2s"
  retry_on_status: [502, 503, 504]
  retry_non_idempotent: false

rate_limit:
  enabled: true
  rps: 100
  burst: 50
  by: "ip"

logging:
  level: "info"
  format: "json"
  access_log: true

timeouts:
  read_header: "10s"
  write: "0s"
  idle: "90s"
